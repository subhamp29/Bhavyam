systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
# Memory budget: this project is routinely built on 8 GB / 4-core Windows hosts.
# The previous -Xmx4096m made the Gradle daemon itself die reserving G1 virtual
# space (hs_err_pid*.log: "Native memory allocation (mmap) failed"), and left
# too little headroom for the separate Kotlin compile daemon ("Could not
# reserve enough space for object heap"). Keep the pair small enough that both
# fit alongside the OS. Raise these on machines with more RAM.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
# The Kotlin compile daemon is a separate JVM; it needs its own explicit budget
# or it inherits a default sized for a 64-bit host and starves on small boxes.
# Default is 1.5 GB, which OOMs on the shared runner while it reads the fat
# material-icons-extended JAR (8.7 KB class, but the compiler streams the whole
# container through ASM). 2 GB leaves headroom for the AAPT2/R8/D8 heaps.
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC
# Two modules only. Serial project execution keeps peak RSS down; a small worker
# count stops AAPT2/D8/R8 from each claiming a heap at the same time.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Preserve the existing Kotlin plugin and Android DSL with Backdrop's required AGP 9.
android.builtInKotlin=false
android.newDsl=false

# Release Keystore Signing Configuration (Default alias; passwords should be set via env / GitHub Secrets)
RELEASE_STORE_FILE=release.jks
RELEASE_KEY_ALIAS=release_key
