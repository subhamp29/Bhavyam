name: Publish Selected Release

on:
  # Normal path: bump versionName/versionCode, commit, tag, push. The tag push
  # builds and publishes on its own, so a release is never a manual step.
  push:
    tags:
      - 'v*'
  # Escape hatch for re-publishing an existing tag with custom notes, or for
  # recovering a release that failed to publish.
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Git Tag (e.g., 1.1)'
        required: true
        default: '1.1'
      release_name:
        description: 'Release Title (e.g., Bhavyam 1.1)'
        required: false
        default: ''
      release_notes:
        description: 'Changelog / Release Notes'
        required: false
        default: ''

# A re-dispatch of the same tag must not race itself: two concurrent runs would
# build and upload the same assets to the same release. github.ref_name covers
# the tag-push trigger, where inputs.tag_name is empty.
concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Gate publishing on the in-app updater being able to see and install it.
  # AppUpdateManager reads releases/latest, strips a leading "v" from the tag and
  # compares it with versionName in app/build.gradle.kts, then downloads the
  # first asset whose name ends in .apk and refuses to install it unless
  # verifyDownloadedApk finds a strictly greater versionCode plus a matching
  # signing certificate. A release that breaks any of those rules fails silently
  # for users, so it must fail loudly here instead.
  verify:
    name: Verify Release Is Installable In-App
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      tag: ${{ steps.resolve.outputs.tag }}
      version_name: ${{ steps.check.outputs.version_name }}
      version_code: ${{ steps.check.outputs.version_code }}
      previous_tag: ${{ steps.check.outputs.previous_tag }}
    env:
      # Empty on the tag-push trigger, where the ref already names the tag.
      REQUESTED_TAG: ${{ inputs.tag_name || github.ref_name }}

    steps:
      # fetch-depth 0 pulls every branch and every tag, so the release tag can be
      # resolved locally below instead of trusting the dispatch input verbatim.
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The tag may be spelled either "1.1" or "v1.1" (a manual dispatch lets the
      # user type the bare version), so accept either and pin to a commit SHA.
      - name: Resolve release tag to a commit SHA
        id: resolve
        run: |
          RESOLVED_SHA=""
          RESOLVED_TAG=""
          for CANDIDATE in "v${REQUESTED_TAG}" "${REQUESTED_TAG}"; do
            CANDIDATE_SHA=$(git rev-parse --verify --quiet "${CANDIDATE}^{commit}" || true)
            if [ -n "$CANDIDATE_SHA" ]; then
              RESOLVED_SHA="$CANDIDATE_SHA"
              RESOLVED_TAG="$CANDIDATE"
              break
            fi
          done
          if [ -z "$RESOLVED_SHA" ]; then
            echo "::error::Cannot resolve the release ref: neither tag 'v${REQUESTED_TAG}' nor tag '${REQUESTED_TAG}' exists in this repository. Available tags: $(git tag -l | tr '\n' ' ')"
            exit 1
          fi
          echo "sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$RESOLVED_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved '${REQUESTED_TAG}' -> tag '${RESOLVED_TAG}' at $RESOLVED_SHA"

      # Everything below reads app/build.gradle.kts as it exists at the release
      # tag rather than at the default branch, because that is what gets built.
      - name: Checkout the exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Enforce tag/versionName agreement and a versionCode bump
        id: check
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          RELEASE_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          # Every parse keeps '|| true': the runner shell is "bash -e -o pipefail",
          # so a grep that matches nothing would abort the step before the explicit
          # ::error:: messages below could explain what is actually wrong.
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | head -n1 | sed -E 's/.*versionCode = ([0-9]+).*/\1/' || true)

          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not parse versionName from app/build.gradle.kts at '${RELEASE_TAG}'. AppUpdateManager decides whether an update exists by comparing the release tag with versionName, so an unparseable versionName leaves every in-app update check undeterminable."
            exit 1
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          # Normalise exactly the way AppUpdateManager does before comparing.
          NORMALISED_TAG=$(printf '%s' "$REQUESTED_TAG" | sed -E 's/^[vV]//')
          if [ "$NORMALISED_TAG" != "$VERSION_NAME" ]; then
            echo "::error::Release tag '${REQUESTED_TAG}' does not match versionName '${VERSION_NAME}' from app/build.gradle.kts at tag '${RELEASE_TAG}'. AppUpdateManager reads releases/latest and compares the tag, after stripping a leading 'v', with versionName; when they disagree the new release is undetectable, so every in-app update check silently does nothing and users stay pinned to the old build. Re-tag as 'v${VERSION_NAME}' (or set versionName to '${NORMALISED_TAG}') and re-run."
            exit 1
          fi
          echo "Tag '${REQUESTED_TAG}' normalises to '${NORMALISED_TAG}', which equals versionName '${VERSION_NAME}'."

          if [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not parse versionCode from app/build.gradle.kts at '${RELEASE_TAG}'. AppUpdateManager.verifyDownloadedApk requires the downloaded APK's versionCode to be strictly greater than the installed app's, so an unparseable versionCode cannot be proven installable in-app."
            exit 1
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          # Most recent tag other than the one being released, newest first.
          PREV_TAG=""
          for CANDIDATE in $(git tag --sort=-v:refname || true); do
            CANDIDATE_SHA=$(git rev-parse --verify --quiet "${CANDIDATE}^{commit}" || true)
            # Skip the release itself and any tag already pointing at the same
            # commit, e.g. both "4.2.2" and "v4.2.2".
            if [ -z "$CANDIDATE_SHA" ] || [ "$CANDIDATE_SHA" = "$RELEASE_SHA" ]; then
              continue
            fi
            PREV_TAG="$CANDIDATE"
            break
          done

          if [ -z "$PREV_TAG" ]; then
            echo "::warning::No release tag other than '${RELEASE_TAG}' exists, so the versionCode bump check was skipped. AppUpdateManager.verifyDownloadedApk only accepts an APK whose versionCode is strictly greater than the installed app's."
          else
            PREV_CODE=$(git show "${PREV_TAG}:app/build.gradle.kts" 2>/dev/null | grep 'versionCode = ' | head -n1 | sed -E 's/.*versionCode = ([0-9]+).*/\1/' || true)
            if [ -z "$PREV_CODE" ]; then
              echo "::warning::Could not parse versionCode from '${PREV_TAG}:app/build.gradle.kts', so the versionCode bump check was skipped. AppUpdateManager.verifyDownloadedApk only accepts an APK whose versionCode is strictly greater than the installed app's."
            else
              echo "previous_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
              if [ "$VERSION_CODE" -le "$PREV_CODE" ]; then
                echo "::error::versionCode was not bumped: this release '${RELEASE_TAG}' ships versionCode ${VERSION_CODE}, but previous release '${PREV_TAG}' already shipped ${PREV_CODE}. AppUpdateManager.verifyDownloadedApk requires the downloaded APK's versionCode to be STRICTLY GREATER than the installed app's, so the in-app updater would download this release and then refuse to install it. Bump versionCode in app/build.gradle.kts and re-run."
                exit 1
              fi
              echo "versionCode bumped ${PREV_CODE} ('${PREV_TAG}') -> ${VERSION_CODE} ('${RELEASE_TAG}')."
            fi
          fi

  release:
    name: Build & Publish Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
      # Authoritative version string, parsed from app/build.gradle.kts at the
      # release tag by the verify job. It equals inputs.tag_name with any leading
      # "v" removed, so asset names are identical for either input form.
      TAG: ${{ needs.verify.outputs.version_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Pinned to the SHA the verify job resolved, so a bare "4.2.2" input
          # still builds the real "v4.2.2" tag.
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Install pinned NDK + CMake
        run: |
          yes | "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Preflight - release signing material
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          MISSING=""
          if [ -z "$SIGNING_KEY" ]; then MISSING="$MISSING SIGNING_KEY"; fi
          if [ -z "$STORE_PASSWORD" ]; then MISSING="$MISSING KEY_STORE_PASSWORD"; fi
          if [ -z "$KEY_PASSWORD" ]; then MISSING="$MISSING KEY_PASSWORD"; fi
          if [ -n "$MISSING" ]; then
            echo "::error title=Release signing not configured::Missing repository secrets:$MISSING. Without them app/build.gradle.kts falls back to initWith(debug), so the build either dies at :app:validateSigningRelease with 'Keystore file debug.keystore not found' or, worse, succeeds and publishes a debug-signed APK. The in-app updater compares signing certificates and will refuse that APK with INSTALL_FAILED_UPDATE_INCOMPATIBLE, so it must not be published. Add them under Settings -> Secrets and variables -> Actions. Accepted names: SIGNING_KEY; KEY_STORE_PASSWORD or RELEASE_STORE_PASSWORD; KEY_PASSWORD or RELEASE_KEY_PASSWORD; optionally ALIAS or RELEASE_KEY_ALIAS. Copy the values straight from the .env file in the repository root."
            exit 1
          fi
          echo "Release signing secrets present."

      - name: Build Android 10 Release APKs (compressed + raw)
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew assembleRelease assembleRawRelease --stacktrace 2>&1 | tee build-android10.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            # Re-surface the cause as step annotations. The raw log needs repo
            # admin to download over the API, so without this a red build is only
            # actionable to someone who can open the run in a browser.
            echo "::group::Release build failure detail"
            grep -nE "^(e: |.*: error:|.* error: |.*FAILED$|FAILURE: |\* What went wrong:|Execution failed for task|> Task .* FAILED)" build-android10.log \
              | tail -n 10 \
              | cut -c1-900 \
              | while IFS= read -r LINE; do
                  echo "::error title=Gradle failure::${LINE//'%'/'%25'}"
                done
            echo "::endgroup::"
            exit "$BUILD_STATUS"
          fi
          echo "Release APKs built."

      - name: Sign Release APK with Custom Key (Optional)
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Sign Raw APK with Custom Key (Optional)
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app_raw
        with:
          releaseDirectory: app/build/outputs/apk/rawRelease
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Stage Android 10 Final APKs
        run: |
          mkdir -p final_apk
          # TAG is the versionName parsed from the release tag by the verify job.
          # Universal release (Android 10+, R8 + ProGuard + shrinkResources).
          # The "1-" prefix sorts this asset first, because release assets are
          # listed alphabetically and the in-app updater downloads the first .apk.
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/Bhavyam-v${TAG}-1-universal.apk
          else
            cp app/build/outputs/apk/release/app-release.apk final_apk/Bhavyam-v${TAG}-1-universal.apk
          fi
          # Universal uncompressed variant (Android 10+, raw debuggable/unminified)
          if [ -f "app/build/outputs/apk/rawRelease/app-rawRelease-signed.apk" ]; then
            cp app/build/outputs/apk/rawRelease/app-rawRelease-signed.apk final_apk/Bhavyam-v${TAG}-universal-uncompressed.apk
          else
            cp app/build/outputs/apk/rawRelease/app-rawRelease.apk final_apk/Bhavyam-v${TAG}-universal-uncompressed.apk
          fi
          rm -rf app/build/outputs/apk/release/*

      - name: Build Android 7.0 Legacy APK (compressed)
        env:
          ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PminSdk=24 --stacktrace

      - name: Sign Android 7 Legacy APK with Custom Key (Optional)
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app_legacy
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Stage Android 7 Final APK
        run: |
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/Bhavyam-v${TAG}-android7.apk
          else
            cp app/build/outputs/apk/release/app-release.apk final_apk/Bhavyam-v${TAG}-android7.apk
          fi
          ls -lh final_apk/

      - name: Verify APK signatures + publish checksums
        run: |
          # Never publish a package the installer will reject as invalid.
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDKROOT/build-tools" -maxdepth 2 -name apksigner 2>/dev/null | head -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found under $SDKROOT, skipping signature verification"
          else
            for apk in final_apk/*.apk; do
              echo "Verifying $apk ..."
              "$APKSIGNER" verify --print-certs "$apk" > /dev/null || { echo "::error::APK failed signature verification: $apk"; exit 1; }
            done
            echo "All APK signatures valid."
          fi
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          cat final_apk/SHA256SUMS.txt

      - name: Prepare Release Notes & Compatibility Notice
        env:
          TAG: ${{ needs.verify.outputs.version_name }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          cat << 'EOF' | sed 's/^ *//' > notice.md
          ### 📦 Download Packages & Compatibility

          | Package | Recommended OS | Description |
          | :--- | :--- | :--- |
          | **`Bhavyam-v__TAG__-1-universal.apk`** (~22 MB) | **Android 10+ (Android 10 – 16+)** | **Standard Recommended Release.** R8-optimized with uncompressed page-aligned native libraries for instant memory mapping. |
          | **`Bhavyam-v__TAG__-universal-uncompressed.apk`** (~89 MB) | **Android 10+ (Android 10 – 16+)** | **Raw Release.** Unminified debuggable variant with uncompressed native libraries. |
          | **`Bhavyam-v__TAG__-android7.apk`** (~17 MB) | **Android 7.0 – 9.0 (Legacy)** | **Legacy Android 7.0+ Variant.** Built with compressed native libraries for older package managers. |

          > [!NOTE]
          > All three APKs are attached to this release and each one is listed in `SHA256SUMS.txt`. The `1-` prefix on the recommended build is deliberate: the in-app updater downloads the **first** asset whose name ends in `.apk`, and release assets are ordered alphabetically, so **`Bhavyam-v__TAG__-1-universal.apk`** is always the build that **Check for updates** offers. Download the other two manually if you need them.

          > [!WARNING]
          > **Notice for Android 7.0 – 9.0 Users (`Bhavyam-v__TAG__-android7.apk`):**
          > - Hardware GPU glassmorphism / live blur requires Android 12+ and is automatically replaced with translucent dark canvas acrylic styling on older devices.
          > - The media notification uses classic Android media controls rather than Android 13's wavy-progress player.
          > - For any device running Android 10 or newer, please install the standard **`Bhavyam-v__TAG__-1-universal.apk`** for optimal performance and memory efficiency.
          EOF

          sed -i "s/__TAG__/${TAG}/g" notice.md

          if echo "$NOTES" | grep -q "android7"; then
            printf "%s\n" "$NOTES" > release_body.md
          elif [ -n "$NOTES" ]; then
            printf "%s\n\n---\n\n" "$NOTES" > release_body.md
            cat notice.md >> release_body.md
          else
            cat notice.md > release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # inputs.* is empty on the tag-push trigger; the verify job resolved the
          # tag from the ref, so publish against that.
          tag_name: ${{ inputs.tag_name || needs.verify.outputs.tag }}
          name: ${{ inputs.release_name || format('Bhavyam {0}', needs.verify.outputs.version_name) }}
          body_path: release_body.md
          files: |
            final_apk/*.apk
            final_apk/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
