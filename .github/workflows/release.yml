name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          accept-android-sdk-licenses: true
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Android 10+ Universal and Raw APKs
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleRawRelease

      - name: Sign Release APK with Custom Key (Optional)
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Sign Raw APK with Custom Key (Optional)
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app_raw
        with:
          releaseDirectory: app/build/outputs/apk/rawRelease
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Stage Universal and Raw APKs
        run: |
          mkdir -p final_apk
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG:-2.1}"
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/Bhavyam-v${TAG}-1-universal.apk
          else
            cp app/build/outputs/apk/release/*.apk final_apk/Bhavyam-v${TAG}-1-universal.apk
          fi
          if [ -f "app/build/outputs/apk/rawRelease/app-rawRelease-signed.apk" ]; then
            cp app/build/outputs/apk/rawRelease/app-rawRelease-signed.apk final_apk/Bhavyam-v${TAG}-universal-uncompressed.apk
          else
            cp app/build/outputs/apk/rawRelease/*.apk final_apk/Bhavyam-v${TAG}-universal-uncompressed.apk
          fi
          rm -rf app/build/outputs/apk/release/*

      - name: Build Android 7.0 Legacy APK (compressed)
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PminSdk=24

      - name: Sign Android 7 Legacy APK with Custom Key (Optional)
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app_legacy
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "35.0.0"

      - name: Stage Android 7 APK & Checksums
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          TAG="${TAG:-2.1}"
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            cp app/build/outputs/apk/release/app-release-signed.apk final_apk/Bhavyam-v${TAG}-android7.apk
          else
            cp app/build/outputs/apk/release/*.apk final_apk/Bhavyam-v${TAG}-android7.apk
          fi
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          ls -la final_apk/

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            final_apk/*.apk
            final_apk/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}